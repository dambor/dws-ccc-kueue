# ─────────────────────────────────────────────────────────────────────────────
# Stop Trashing Nodes: Combining Atomic Provisioning with Node Reuse in GKE
#
# This configuration implements the TAS-enabled flavor fallback pattern from
# the "Node reuse for DWS FS-Queued" guide. It allows subsequent jobs to run
# immediately on idle infrastructure provisioned by previous DWS Flex-start
# Queued workloads, eliminating redundant scale-ups.
#
# Both flavors point at the SAME queued-provisioning pool (gpu-dws-pool).
#   • regular-flavor — no admission check. If idle/warm nodes already exist,
#     Kueue's TAS cache sees them and admits the workload INSTANTLY (no PR).
#   • dws-flavor     — backed by a queued-provisioning ProvisioningRequest.
#     Used only when the TAS check for regular-flavor fails (empty cluster),
#     triggering an atomic DWS scale-up.
#
# Because EVERY flavor in default-cq is TAS-enabled (topologyName set),
# the ClusterQueue is "TAS-only" and Kueue implies TAS for every workload —
# jobs need NO topology annotation.
#
# User opt-in for reuse:
#   • WITH cloud.google.com/gke-queued toleration → TAS counts the warm
#     queued node → regular-flavor admits → reuse, no PR.
#   • WITHOUT it → the node's gke-queued taint is untolerated →
#     regular-flavor fails → fall back to dws-flavor → fresh dedicated PR.
#
# Requires Kueue >= v0.14 (TopologyAwareScheduling beta/on-by-default) and
# the v1beta2 API. deploy.sh pins v0.18.0, which satisfies both.
# ─────────────────────────────────────────────────────────────────────────────

# Topology Definition
# Defines the topology levels Kueue should track. For simple node reuse,
# tracking at the hostname (node) level is sufficient.
apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: "default"
spec:
  levels:
  - nodeLabel: "kubernetes.io/hostname"
---
# Preferred flavor: plain scheduling against the DWS pool. No PR — if a warm
# node is in the TAS cache, the workload admits immediately and reuses it.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: "regular-flavor"
spec:
  nodeLabels:
    cloud.google.com/compute-class: "ccc-dws"
    pool-type: "ondemand"
  topologyName: "default"
  tolerations:
  - key: cloud.google.com/compute-class
    operator: Equal
    value: "ccc-dws"
    effect: NoSchedule
---
# Fallback flavor: same pool, but gated by a queued-provisioning PR. Only used
# when regular-flavor's TAS check finds no nodes — i.e. a cold start.
# NOTE: tolerations are required here so the PR's PodTemplate can match the
# queued pool's taints. Without them, the autoscaler reports
# "No nodepool with QueuedProvisioning enabled is available for scale up".
# regular-flavor stays toleration-free so the Job's gke-queued toleration
# remains the opt-in switch for reuse.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: "dws-flavor"
spec:
  nodeLabels:
    cloud.google.com/compute-class: "ccc-dws"
    pool-type: "ondemand"
  topologyName: "default"
  tolerations:
  - key: cloud.google.com/gke-queued
    operator: Equal
    value: "true"
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: cloud.google.com/compute-class
    operator: Equal
    value: "ccc-dws"
    effect: NoSchedule
---
# Provisioning Request Configuration
# Defines the DWS provisioning class. podSetUpdates injects the dynamic PR node
# selector into pods ONLY when they are admitted via dws-flavor, so warm-reuse
# pods (admitted via regular-flavor) are never pinned to a specific PR.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ProvisioningRequestConfig
metadata:
  name: dws-config
spec:
  provisioningClassName: queued-provisioning.gke.io
  podSetUpdates:
    nodeSelector:
    - key: autoscaling.gke.io/provisioning-request
      valueFromProvisioningClassDetail: ResizeRequestName
  managedResources:
  - nvidia.com/gpu
---
# Admission Check
# Links dws-flavor to the Provisioning Request controller.
apiVersion: kueue.x-k8s.io/v1beta2
kind: AdmissionCheck
metadata:
  name: dws-provisioning-check
spec:
  controllerName: kueue.x-k8s.io/provisioning-request
  parameters:
    apiGroup: kueue.x-k8s.io
    kind: ProvisioningRequestConfig
    name: dws-config
---
# ClusterQueue and LocalQueue
# regular-flavor first, falling back to dws-flavor if needed. The PR check
# applies ONLY to dws-flavor. regular-flavor admits with no check so warm
# reuse is instant.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: default-cq
spec:
  namespaceSelector: {}
  admissionChecksStrategy:
    admissionChecks:
    - name: dws-provisioning-check
      onFlavors:
      - dws-flavor
  resourceGroups:
  - coveredResources: ["nvidia.com/gpu"]
    flavors:
    - name: regular-flavor
      resources:
      - name: "nvidia.com/gpu"
        nominalQuota: 1000
    - name: dws-flavor
      resources:
      - name: "nvidia.com/gpu"
        nominalQuota: 1000
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  namespace: default
  name: default-lq
spec:
  clusterQueue: default-cq
