apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: ccc-dws
spec:
  nodePoolAutoCreation:
    enabled: true
  priorities:
  - nodepools: [gpu-dws-spot-pool]   # 1st: spot (cheapest, preemptible)
  - nodepools: [gpu-dws-flex-pool]   # 2nd: DWS Flex non-queued (reuse-capable)
  - nodepools: [gpu-dws-pool]        # 3rd: DWS Flex + queued (gang-scheduling, no reuse)
