apiVersion: kueue.x-k8s.io/v1beta1
kind: ProvisioningRequestConfig
metadata:
  name: dws-prc
spec:
  provisioningClassName: queued-provisioning.gke.io
  parameters:
    maxRunDurationSeconds: "3600"
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: AdmissionCheck
metadata:
  name: dws-check
spec:
  controllerName: kueue.x-k8s.io/provisioning-request
  parameters:
    apiGroup: kueue.x-k8s.io
    kind: ProvisioningRequestConfig
    name: dws-prc
---
# Spot flavor — pool gerenciado pelo cluster autoscaler (sem admission check)
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: flavor-spot
spec:
  nodeLabels:
    cloud.google.com/compute-class: "ccc-dws"
    pool-type: "spot"
  tolerations:
  - key: cloud.google.com/gke-spot
    operator: Equal
    value: "true"
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
---
# Flex flavor (NON-queued DWS) — pool gerenciado pelo cluster autoscaler com
# Flex Start. Nós são RECICLADOS entre workloads (warm reuse). Sem admission check.
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: flavor-flex
spec:
  nodeLabels:
    cloud.google.com/compute-class: "ccc-dws"
    pool-type: "flex"
  tolerations:
  - key: cloud.google.com/gke-flex-start
    operator: Equal
    value: "true"
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
---
# On-demand flavor (QUEUED DWS) — pool gerenciado pelo DWS via ProvisioningRequest.
# Gang-scheduling atômico, mas SEM reuso entre workloads (PR per-workload).
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: flavor-ondemand
spec:
  nodeLabels:
    cloud.google.com/compute-class: "ccc-dws"
    pool-type: "ondemand"
  tolerations:
  - key: cloud.google.com/gke-queued
    operator: Equal
    value: "true"
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: cluster-queue-dws
spec:
  # dws-check só se aplica ao flavor-ondemand (DWS queued).
  # flavor-flex (non-queued) e flavor-spot não precisam de PR.
  admissionChecksStrategy:
    admissionChecks:
    - name: dws-check
      onFlavors: ["flavor-ondemand"]
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
    flavors:
    - name: flavor-spot         # 1st: spot (cheapest)
      resources:
      - name: "cpu"
        nominalQuota: 100
      - name: "memory"
        nominalQuota: 400Gi
      - name: "nvidia.com/gpu"
        nominalQuota: 4
    - name: flavor-flex         # 2nd: DWS Flex non-queued (reuse-capable)
      resources:
      - name: "cpu"
        nominalQuota: 100
      - name: "memory"
        nominalQuota: 400Gi
      - name: "nvidia.com/gpu"
        nominalQuota: 4
    - name: flavor-ondemand     # 3rd: DWS Flex + queued (gang-scheduling fallback)
      resources:
      - name: "cpu"
        nominalQuota: 100
      - name: "memory"
        nominalQuota: 400Gi
      - name: "nvidia.com/gpu"
        nominalQuota: 4
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: local-queue-dws
  namespace: default
spec:
  clusterQueue: cluster-queue-dws
---
# ─────────────────────────────────────────────────────────────────────────────
# Experiment: Kueue + ProvisioningRequest + reuse on the FSNQ pool.
# Uses provisioningClassName: best-effort-atomic.autoscaling.x-k8s.io.
# Tests whether this PR class preserves the FSNQ node-recycling lifecycle.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kueue.x-k8s.io/v1beta1
kind: ProvisioningRequestConfig
metadata:
  name: best-effort-atomic-prc
spec:
  provisioningClassName: best-effort-atomic.autoscaling.x-k8s.io
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: AdmissionCheck
metadata:
  name: best-effort-atomic-check
spec:
  controllerName: kueue.x-k8s.io/provisioning-request
  parameters:
    apiGroup: kueue.x-k8s.io
    kind: ProvisioningRequestConfig
    name: best-effort-atomic-prc
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: flavor-flex-pr
spec:
  nodeLabels:
    cloud.google.com/compute-class: "ccc-dws"
    pool-type: "flex"
  tolerations:
  - key: cloud.google.com/gke-flex-start
    operator: Equal
    value: "true"
    effect: NoSchedule
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: cluster-queue-flex-pr
spec:
  admissionChecksStrategy:
    admissionChecks:
    - name: best-effort-atomic-check
      onFlavors: ["flavor-flex-pr"]
  namespaceSelector: {}
  resourceGroups:
  - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
    flavors:
    - name: flavor-flex-pr
      resources:
      - name: "cpu"
        nominalQuota: 100
      - name: "memory"
        nominalQuota: 400Gi
      - name: "nvidia.com/gpu"
        nominalQuota: 2
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: local-queue-flex-pr
  namespace: default
spec:
  clusterQueue: cluster-queue-flex-pr
